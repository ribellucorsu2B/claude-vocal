name: Construire le .exe

# Se lance quand une nouvelle version est publiée (onglet Releases), et à la
# demande (onglet Actions > Construire le .exe > Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fabriquer l'icône
        run: python voxoff.py --icone icone.ico

      - name: Construire VoxOff.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name VoxOff --icon icone.ico
          --add-data "sons;sons"
          --collect-all vosk --hidden-import pystray._win32
          voxoff.py

      - name: Vérifier que le .exe démarre et charge tout
        shell: pwsh
        run: |
          $resultat = Join-Path $PWD "verification.txt"
          Start-Process -FilePath "dist\VoxOff.exe" -ArgumentList "--verifier", "`"$resultat`"" -Wait
          if (-not (Test-Path $resultat)) { throw "Le .exe n'a rien écrit : il ne démarre pas." }
          $contenu = Get-Content $resultat -Raw
          Write-Host $contenu
          if (-not $contenu.StartsWith("OK")) { throw "Le .exe démarre mais il manque quelque chose." }

      - uses: actions/upload-artifact@v6
        with:
          name: VoxOff
          path: dist/VoxOff.exe

      - name: Ajouter le .exe à la version publiée
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/VoxOff.exe --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            cat > notes.md <<'FIN'
          ## 🇫🇷 Installation

          1. Télécharge **VoxOff.exe** ci-dessous et range-le dans un dossier où il restera (par exemple `Documents\VoxOff`).
          2. Double-clique dessus. Si un avertissement s'affiche, c'est normal pour un nouveau programme : le mode d'emploi du projet explique quoi faire.
          3. Au premier lancement, il télécharge le modèle vocal (~40 Mo). Une icône verte apparaît près de l'horloge.

          Dis ensuite : « Ordinateur, éteins-toi » ou « Ordinateur, mets-toi en veille ».

          ## 🇬🇧 Installation

          1. Download **VoxOff.exe** below and keep it in a folder where it will stay (e.g. `Documents\VoxOff`).
          2. Double-click it. A warning may appear: this is normal for a new program, see the README.
          3. On first launch it downloads the voice model (~40 MB). A green icon appears next to the clock.

          If Windows is in English, VoxOff starts in English automatically. Otherwise, right-click the icon, open **Réglages** and set `langue = en`. Then say "Computer, shut down" or "Computer, go to sleep".
          FIN
            gh release edit "$TAG" --notes-file notes.md
          fi
