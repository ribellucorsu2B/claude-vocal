name: Construire le .exe

# Se lance quand une nouvelle version est publiée (onglet Releases), et à la
# demande (onglet Actions > Construire le .exe > Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fabriquer l'icône
        run: python claude_vocal.py --icone icone.ico

      - name: Construire ClaudeVocal.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ClaudeVocal --icon icone.ico
          --collect-all vosk --hidden-import pystray._win32
          claude_vocal.py

      - name: Vérifier que le .exe démarre et charge tout
        shell: pwsh
        run: |
          $resultat = Join-Path $PWD "verification.txt"
          Start-Process -FilePath "dist\ClaudeVocal.exe" -ArgumentList "--verifier", "`"$resultat`"" -Wait
          if (-not (Test-Path $resultat)) { throw "Le .exe n'a rien écrit : il ne démarre pas." }
          $contenu = Get-Content $resultat -Raw
          Write-Host $contenu
          if (-not $contenu.StartsWith("OK")) { throw "Le .exe démarre mais il manque quelque chose." }

      - uses: actions/upload-artifact@v6
        with:
          name: ClaudeVocal
          path: dist/ClaudeVocal.exe

      - name: Ajouter le .exe à la version publiée
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/ClaudeVocal.exe --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            cat > notes.md <<'FIN'
          ## Installation

          1. Télécharge **ClaudeVocal.exe** ci-dessous et range-le dans un dossier où il restera (par exemple `Documents\ClaudeVocal`).
          2. Double-clique dessus. Si Windows affiche « Windows a protégé votre ordinateur », clique sur **Informations complémentaires**, puis **Exécuter quand même** (le programme n'est pas signé, c'est normal).
          3. Au premier lancement, il télécharge le modèle vocal français (~40 Mo) : une minute et c'est prêt. Une icône verte apparaît près de l'horloge.

          Dis ensuite : « Claude, éteins l'ordinateur » ou « Claude, mets en veille l'ordinateur ».
          Clic droit sur l'icône pour le mode test, les réglages (prénom, micro, délais) ou pour quitter.
          FIN
            gh release edit "$TAG" --notes-file notes.md
          fi
